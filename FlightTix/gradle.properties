org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- GitHub Packages credentials for the Identus native anoncreds dependency ---
# The Identus SDK's `anoncreds_uniffi-android` artifact lives on GitHub Packages and
# needs a GitHub username + PAT (scope: read:packages) to download. Prefer setting these
# in your *user* ~/.gradle/gradle.properties (kept out of the repo) rather than here:
#     gpr.user=your-github-username
#     gpr.token=ghp_xxxxYourTokenWithReadPackagesxxxx
